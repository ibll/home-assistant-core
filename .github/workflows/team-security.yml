name: Team pipeline / Security

# Issues C2 (dependency vulnerabilities), C3 (new-dependency tracker), C4
# (workflow hardening) and C5 (SBOM) extend this stage.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      inject-failure:
        description: Stage to fail on purpose, see team-pipeline.yml.
        type: string
        default: none
      requirements-changed:
        description: Whether any requirements file or manifest requirement changed.
        type: string
        default: "false"

permissions: {}

# The stage suffix keeps this group distinct from the caller's group in
# team-pipeline.yml; sharing it would make the stage cancel itself.
concurrency:
  group: ${{ github.workflow }}-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # To check out the repository
      security-events: write # To upload Gitleaks results to code scanning
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inject failure
        uses: ./.github/actions/team-inject-failure # zizmor: ignore[self-repository] actionlint lacks $/ support
        with:
          stage: security
          inject-failure: ${{ inputs.inject-failure }}
      - name: Scan commits with Gitleaks
        id: gitleaks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          gitleaks_version="8.30.1"
          gitleaks_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${gitleaks_sha256}  ${archive}" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

          if [[ -n "$PR_BASE_SHA" ]]; then
            commit_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            commit_range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            commit_range="--all"
          fi

          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="$commit_range" \
            --redact \
            --report-format=sarif \
            --report-path=gitleaks.sarif
          scan_status=$?
          set -e
          if [[ ! -f gitleaks.sarif ]]; then
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Gitleaks","version":"%s"}},"results":[]}]}' \
              "$gitleaks_version" > gitleaks.sarif
          fi
          echo "exit_code=${scan_status}" >> "$GITHUB_OUTPUT"
      - name: Upload Gitleaks results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload Gitleaks SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks.sarif
          path: gitleaks.sarif
          if-no-files-found: error
      - name: Fail when Gitleaks finds secrets
        if: steps.gitleaks.outputs.exit_code != '0'
        env:
          SCAN_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          echo "::error::Gitleaks found secrets (exit ${SCAN_EXIT_CODE})"
          exit 1
