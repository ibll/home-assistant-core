name: Team pipeline / Security

# Issues C1 (secrets), C3 (new-dependency tracker), C4 (workflow hardening)
# and C5 (SBOM) add more checks to this stage.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      inject-failure:
        description: Stage to fail on purpose, see team-pipeline.yml.
        type: string
        default: none
      requirements-changed:
        description: Whether any requirements file or manifest requirement changed.
        type: string
        default: "false"

permissions: {}

# The stage suffix keeps this group distinct from the caller's group in
# team-pipeline.yml; sharing it would make the stage cancel itself.
concurrency:
  group: ${{ github.workflow }}-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # To check out the repository
      security-events: write # To upload the Gitleaks SARIF report
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Inject failure
        uses: ./.github/actions/team-inject-failure # zizmor: ignore[self-repository] actionlint lacks $/ support
        with:
          stage: security
          inject-failure: ${{ inputs.inject-failure }}
      - name: Get uv version
        id: uv-version
        run: echo "version=$(grep '^uv==' requirements.txt | cut -d'=' -f3)" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python # zizmor: ignore[self-repository] actionlint lacks $/ support
        with:
          python-version: "3.14"
          uv-version: ${{ steps.uv-version.outputs.version }}
      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            range="$PR_BASE_SHA..$HEAD_SHA"
          elif [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi
          ./gitleaks detect --source . --log-opts="$range" --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload Gitleaks results to Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload Gitleaks report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks
          path: gitleaks.sarif
          if-no-files-found: warn
      - name: Audit core requirements
        run: uvx --from pip-audit pip-audit -r requirements.txt --format json > pip-audit.json
      - name: Review dependency changes
        if: inputs.requirements-changed == 'true' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: warn
      - name: Summarize security scans
        env:
          REQUIREMENTS_CHANGED: ${{ inputs.requirements-changed }}
        run: |
          {
            echo "### Security scans"
            echo "Requirements changed: ${REQUIREMENTS_CHANGED}"
            echo "The core requirements audit report is available as the pip-audit artifact."
            echo "The Gitleaks SARIF report is available in Code Scanning and as the gitleaks artifact."
          } >> "$GITHUB_STEP_SUMMARY"
