name: Team pipeline / Security

# Issues C1 (secrets), C3 (new-dependency tracker), C4 (workflow hardening)
# and C5 (SBOM) add more checks to this stage.

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      inject-failure:
        description: Stage to fail on purpose, see team-pipeline.yml.
        type: string
        default: none
      requirements-changed:
        description: Whether any requirements file or manifest requirement changed.
        type: string
        default: "false"

permissions: {}

# The stage suffix keeps this group distinct from the caller's group in
# team-pipeline.yml; sharing it would make the stage cancel itself.
concurrency:
  group: ${{ github.workflow }}-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # To check out the repository
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inject failure
        uses: $/.github/actions/team-inject-failure
        with:
          stage: security
          inject-failure: ${{ inputs.inject-failure }}
      - name: Get uv version
        id: uv-version
        run: echo "version=$(grep '^uv==' requirements.txt | cut -d'=' -f3)" >> "$GITHUB_OUTPUT"
      - name: Set up uv and Python
        uses: $/.github/actions/setup-uv-python
        with:
          python-version: "3.14"
          uv-version: ${{ steps.uv-version.outputs.version }}
      - name: Audit core requirements
        run: uvx --from pip-audit pip-audit -r requirements.txt --format json > pip-audit.json
      - name: Review dependency changes
        if: inputs.requirements-changed == 'true' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: warn
      - name: Summarize security scans
        env:
          REQUIREMENTS_CHANGED: ${{ inputs.requirements-changed }}
        run: |
          {
            echo "### Security scans"
            echo "Requirements changed: ${REQUIREMENTS_CHANGED}"
            echo "The core requirements audit report is available as the pip-audit artifact."
          } >> "$GITHUB_STEP_SUMMARY"
