# Reviewed exceptions for the image scan in team-package.yml (issue D3).
#
# The scan fails on CRITICAL vulnerabilities that already have a fix. Add an
# entry here only after checking the finding doesn't affect us, or that the
# fix can't be taken yet. Every entry needs a reason (`statement`) and an
# expiry date, after which the scan fails on it again and someone re-checks it.
#
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
#
# vulnerabilities:
#   - id: CVE-2026-00000
#     paths:
#       - "usr/local/lib/python3.14/site-packages/example"
#     statement: >-
#       Only affects the X feature, which Home Assistant never calls. Upstream
#       pins this version; revisit when they bump it.
#     expired_at: 2026-12-31

vulnerabilities:
  # Found by the second D3 run, after the base image bump.
  - id: CVE-2026-102268
    statement: >-
      PyJWT 2.13.0, pinned by Home Assistant core in requirements.txt and
      homeassistant/package_constraints.txt, which our team rules don't let
      us edit. Upstream has already moved to PyJWT 2.15.1, so the next sync
      from upstream fixes it. If this entry expires first, sync from upstream
      rather than extending it.
    expired_at: 2026-11-12
  - id: CVE-2025-68121
    statement: >-
      Go standard library (crypto/tls) inside the go2rtc 1.9.14 binary, built
      with Go 1.25.6. 1.9.14 is the newest go2rtc release and upstream Home
      Assistant ships the same one, so there is no fixed version to take yet.
      Re-check for a go2rtc release built with Go 1.25.7 or later at expiry.
    expired_at: 2026-11-30
